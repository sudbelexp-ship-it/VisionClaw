name: Build

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    defaults:
      run:
        working-directory: samples/CameraAccess
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.x
        run: |
          echo "Установленные версии Xcode на раннере:"
          ls /Applications | grep Xcode
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1)
          if [ -z "$XCODE_PATH" ]; then
            echo "::error::Не найден Xcode 26.x на раннере macos-26"
            exit 1
          fi
          echo "Выбран: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Generate Secrets.swift
        run: cp CameraAccess/Secrets.swift.example CameraAccess/Secrets.swift

      - name: Build unsigned .app (Release, iphoneos)
        run: |
          xcodebuild \
            -scheme CameraAccess \
            -project CameraAccess.xcodeproj \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            -skipMacroValidation -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            META_APP_ID=0 CLIENT_TOKEN="AR|0|developer-mode-placeholder" DEVELOPMENT_TEAM="" \
            build

      - name: Package unsigned IPA
        id: package
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/CameraAccess.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Не найден собранный .app по пути $APP_PATH"
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr VisionClaw-unsigned.ipa Payload
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: VisionClaw-unsigned-${{ steps.package.outputs.short_sha }}
          path: samples/CameraAccess/VisionClaw-unsigned.ipa
          if-no-files-found: error
